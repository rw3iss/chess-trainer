<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<!-- Single theme-color: useTheme() rewrites it to match the active app theme. -->
		<meta name="theme-color" content="#0e0f12" />
		<meta name="color-scheme" content="dark light" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Openings" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="description" content="Learn chess openings — browse, play through, fork and practise against bots. Works offline." />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
		<title>Chess Openings</title>
		<!-- Fonts: Google Fonts with display=swap (cached by the service worker). Local fallbacks in --font-* stacks. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<script>
			// Apply the persisted theme before first paint (mirrors state/settings THEME_BOOT_KEY).
			(function () {
				try {
					var s = JSON.parse(localStorage.getItem('chess:theme-boot') || '{}');
					var mode = s.mode || 'system';
					var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					var root = document.documentElement;
					root.dataset.theme = mode === 'system' ? (light ? 'light' : 'dark') : mode;
					if (s.density) root.dataset.density = s.density;
					if (s.accent) root.style.setProperty('--color-accent', s.accent);
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root">
			<noscript>This app requires JavaScript.</noscript>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
