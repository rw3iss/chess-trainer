[project]
name = "board-vision"
version = "0.1.0"
description = "Train the square-tile piece classifier used by the PWA's 'load position from image' feature"
requires-python = ">=3.12,<3.13"
dependencies = [
	"torch>=2.5",
	"numpy",
	"pillow",
	"onnx",
	"onnxruntime",
	"onnxscript",
	"chess",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
