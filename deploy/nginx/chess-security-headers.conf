# Security headers for the chess vhost. Installed to /etc/nginx/chess/security-headers.conf.
# Included at server level AND in every location that sets its own add_header (nginx drops inherited
# add_header in such locations). No script CSP: the app needs wasm, workers and inline boot code.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
