# chess.ryanweiss.net — http-level rate-limit zones. Installed to /etc/nginx/conf.d/00-chess-http.conf by
# scripts/deploy/setup-server.sh (00- so the zones exist before the vhost uses them). Chess-only names.
# Keys are the real client IP: the chess vhost restores it from CF-Connecting-IP (chess/realip.conf).
limit_req_zone  $binary_remote_addr zone=chess_auth:10m rate=10r/m;   # /api/auth/{login,register,password,oauth}
limit_req_zone  $binary_remote_addr zone=chess_api:10m  rate=20r/s;   # rest of /api
limit_conn_zone $binary_remote_addr zone=chess_conn:10m;              # open connections per client
