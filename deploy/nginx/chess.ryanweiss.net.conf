# chess.ryanweiss.net — PWA (static) + API at /api (proxy to chess-server on 127.0.0.1:4100).
# Installed to /etc/nginx/conf.d/ by scripts/deploy/setup-server.sh.

upstream chess_api { server 127.0.0.1:4100; keepalive 16; }

server {
    listen 80; listen [::]:80;
    server_name chess.ryanweiss.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name chess.ryanweiss.net;

    ssl_certificate     /etc/letsencrypt/live/chess.ryanweiss.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.ryanweiss.net/privkey.pem;
    ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/chess/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm;

    # API: /api/<path> -> server /<path> (trailing slash strips the prefix).
    location /api/ {
        proxy_pass http://chess_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # socket.io (/engine and /play namespaces): WebSocket upgrade, long timeouts.
    location /api/socket.io/ {
        proxy_pass http://chess_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Service worker + HTML: never cache (PWA update prompt relies on it).
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Hashed build assets + content-hashed datasets: immutable.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* "^/data/.+\.[0-9a-f]{8}\.json$" { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.wasm$ { types { application/wasm wasm; } default_type application/wasm; try_files $uri =404; }

    # SPA fallback.
    location / { try_files $uri $uri/ /index.html; }
}
