# chess.ryanweiss.net (+ chess.rw3iss.com alias) — PWA (static) + API at /api (proxy to chess-server on 127.0.0.1:4100).
# Installed to /etc/nginx/conf.d/ by scripts/deploy/setup-server.sh, with the chess snippets in /etc/nginx/chess/
# (realip, security-headers, proxy, banned) and the rate-limit zones in conf.d/00-chess-http.conf.
# Traffic comes through Cloudflare: realip.conf restores the client IP, so limits and bans are per real client.
# Hardening notes: docs/ops/SECURITY.md.

upstream chess_api { server 127.0.0.1:4100; keepalive 16; }

server {
    listen 80; listen [::]:80;
    server_name chess.ryanweiss.net chess.rw3iss.com;
    include /etc/nginx/chess/realip.conf;
    access_log /var/log/nginx/chess.access.log main;
    error_log  /var/log/nginx/chess.error.log warn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name chess.ryanweiss.net chess.rw3iss.com;

    ssl_certificate     /etc/letsencrypt/live/chess.ryanweiss.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.ryanweiss.net/privkey.pem;
    ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real client IP (Cloudflare), per-client bans (fail2ban action chess-nginx-deny), logs for fail2ban.
    include /etc/nginx/chess/realip.conf;
    include /etc/nginx/chess/banned.conf;
    access_log /var/log/nginx/chess.access.log main;
    error_log  /var/log/nginx/chess.error.log warn;

    # Abuse limits: open connections per client, slow-client timeouts, 429 on limits.
    server_tokens off;
    limit_conn chess_conn 30;
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 2m;

    include /etc/nginx/chess/security-headers.conf;

    root /var/www/chess/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm;

    # Nothing here is PHP / dotfiles: answer scanners with 404 (fail2ban jail chess-scan bans repeat offenders).
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:php\d?|phtml|asp|aspx|jsp|cgi)$ { return 404; }

    # API: /api/<path> -> server /<path>. 20 r/s per client (burst 40).
    location /api/ {
        limit_req zone=chess_api burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/chess/proxy.conf;
    }

    # Sign-in, sign-up, password and OAuth endpoints: 10 r/min per client (burst 5), small bodies.
    location ~ ^/api/auth/(?:login|register|password/|oauth/|google/|lichess/) {
        limit_req zone=chess_auth burst=5 nodelay;
        client_max_body_size 64k;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/chess/proxy.conf;
    }

    # Sync can carry many games at once.
    location = /api/sync {
        limit_req zone=chess_api burst=40 nodelay;
        client_max_body_size 10m;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/chess/proxy.conf;
    }

    # socket.io (/engine and /play namespaces): WebSocket upgrade, long timeouts. Connections count
    # toward limit_conn; no request-rate limit (one long-lived request per socket).
    location /api/socket.io/ {
        proxy_pass http://chess_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Service worker + HTML: never cache (PWA update prompt relies on it).
    location = /sw.js { include /etc/nginx/chess/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { include /etc/nginx/chess/security-headers.conf; add_header Cache-Control "no-cache"; }

    # Hashed build assets + content-hashed datasets: immutable.
    location /assets/ { include /etc/nginx/chess/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* "^/data/.+\.[0-9a-f]{8}\.json$" { include /etc/nginx/chess/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.wasm$ { types { application/wasm wasm; } default_type application/wasm; try_files $uri =404; }

    # SPA fallback.
    # Privacy policy (static page; Google OAuth consent screen links here).
    location = /privacy { return 301 /privacy.html; }
    location / { try_files $uri $uri/ /index.html; }
}
