# Failed / refused sign-in, sign-up, password and OAuth calls on the chess API (nginx 'main' log format).
# 401 bad password, 403 sign-up refused, 429 rate limited (nginx or app).
[Definition]
failregex = ^<HOST> - \S+ \[\] "POST /api/auth/(?:login|register|password/\S+|oauth/\S+) HTTP/[\d.]+" (?:401|403|429) 
ignoreregex =
