# Ban = `deny <ip>;` for nginx. The chess site is behind Cloudflare, so firewall bans would never match
# (the TCP peer is a Cloudflare edge); nginx sees the real client IP (chess/realip.conf) and answers 403.
# SELinux keeps fail2ban out of /etc/nginx, so this action only edits its own list in /var/lib/fail2ban;
# chess-nginx-bans.service (root, polls every 5 s) copies it to /etc/nginx/chess/banned.conf and reloads
# nginx. (SELinux also denies fail2ban running systemctl, and inotify path units did not fire on this dir.)
# Installed by scripts/deploy/setup-server.sh.
[Definition]
banfile = /var/lib/fail2ban/chess-banned.list
actionstart = touch <banfile>
actionstop = : > <banfile>
actioncheck =
actionban = grep -qxF 'deny <ip>;' <banfile> || echo 'deny <ip>;' >> <banfile>
actionunban = grep -vxF 'deny <ip>;' <banfile> > <banfile>.tmp; cat <banfile>.tmp > <banfile>; rm -f <banfile>.tmp
